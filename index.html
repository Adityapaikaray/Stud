<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stud - Merit-Based Social Media</title>
    
    <!-- PWA & Mobile Optimization -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#030303">
    <link rel="apple-touch-icon" href="https://picsum.photos/seed/stud/192/192">
    
    <!-- Fonts & Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              app: {
                text: 'var(--app-text)',
                muted: 'var(--app-text-muted)',
                bg: 'var(--app-bg)',
                accent: 'var(--prism-1)'
              }
            },
            animation: {
              'spring': 'spring 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards',
              'float': 'float 6s ease-in-out infinite',
              'pulse-soft': 'pulse-soft 4s ease-in-out infinite',
            },
            keyframes: {
              spring: {
                '0%': { transform: 'scale(0.95)', opacity: '0' },
                '100%': { transform: 'scale(1)', opacity: '1' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              'pulse-soft': {
                '0%, 100%': { opacity: '0.4', transform: 'scale(1)' },
                '50%': { opacity: '0.8', transform: 'scale(1.05)' },
              }
            }
          }
        }
      }
    </script>
    <style>
        :root {
            --app-bg: #010101;
            --app-text: #ffffff;
            --app-text-muted: #94a3b8;
            --glass-bg: rgba(10, 10, 12, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --prism-1: #ff0080;
            --prism-2: #7928ca;
            --prism-3: #00dfd8;
            --prism-gradient: linear-gradient(135deg, #ff0080 0%, #7928ca 50%, #00dfd8 100%);
            --fluid-ease: cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        body.light-mode {
            --app-bg: #ffffff;
            --app-text: #000000;
            --app-text-muted: #1e293b; /* Darker Slate 800 for better visibility */
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(0, 0, 0, 0.12);
        }

        /* High contrast overrides for Light Mode "Better Vision" */
        body.light-mode .text-slate-400,
        body.light-mode .text-app-muted {
            color: #334155; /* Slate 700 */
            font-weight: 500;
        }
        body.light-mode .text-slate-500 {
            color: #1e293b; /* Slate 800 */
            font-weight: 600;
        }
        body.light-mode .text-slate-600 {
            color: #0f172a; /* Slate 900 */
            font-weight: 600;
        }
        body.light-mode .placeholder-slate-700::placeholder,
        body.light-mode .placeholder-slate-800::placeholder {
            color: #475569;
            opacity: 1;
        }
        body.light-mode .glass {
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        }
        body.light-mode .orb {
            opacity: 0.08; /* Subtler background in light mode to not interfere with text */
        }

        * {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition-timing-function: var(--fluid-ease);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--app-bg);
            color: var(--app-text);
            overflow-x: hidden;
            overscroll-behavior-y: none;
        }

        /* Grain Texture */
        .grain-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            pointer-events: none;
            opacity: 0.035;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .ambient-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(140px);
            opacity: 0.15;
            animation: float-prism 30s infinite alternate ease-in-out;
            mix-blend-mode: screen;
        }

        .orb-1 { width: 70vw; height: 70vw; background: var(--prism-1); top: -25%; left: -10%; }
        .orb-2 { width: 60vw; height: 60vw; background: var(--prism-3); bottom: -15%; right: -5%; animation-delay: -10s; }
        .orb-3 { width: 50vw; height: 50vw; background: var(--prism-2); top: 20%; left: 30%; animation-delay: -20s; }

        @keyframes float-prism {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            33% { transform: translate(10%, 5%) scale(1.1) rotate(10deg); }
            66% { transform: translate(-5%, 15%) scale(0.9) rotate(-10deg); }
            100% { transform: translate(0, 0) scale(1) rotate(0deg); }
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s var(--fluid-ease);
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .merit-gradient {
            background: var(--prism-gradient);
            background-size: 300% 300%;
            animation: prism-flow 8s ease infinite;
        }

        @keyframes prism-flow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Smooth tab highlight */
        .tab-indicator {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .active-glow {
            box-shadow: 0 0 20px rgba(121, 40, 202, 0.4);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
</head>
<body>
    <div class="grain-overlay"></div>
    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
