
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stud - Merit-Based Social Media</title>
    
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#030303">
    <link rel="apple-touch-icon" href="https://picsum.photos/seed/stud/192/192">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              app: {
                text: 'var(--app-text)',
                muted: 'var(--app-text-muted)',
                bg: 'var(--app-bg)',
                accent: 'var(--prism-1)'
              }
            }
          }
        }
      }
    </script>
    <style>
        :root {
            --app-bg: #030303;
            --app-text: #ffffff;
            --app-text-muted: #888888;
            --glass-bg: rgba(15, 15, 20, 0.5);
            --glass-border: rgba(255, 255, 255, 0.06);
            /* Prism Palette - Vibrant but Subtle */
            --prism-1: #ff0080;
            --prism-2: #7928ca;
            --prism-3: #00dfd8;
            --prism-4: #ffafbd;
            
            --prism-gradient: linear-gradient(135deg, #ff0080 0%, #7928ca 50%, #00dfd8 100%);
            --fluid-ease: cubic-bezier(0.2, 0.8, 0.2, 1);
            --spring-ease: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @media (max-width: 640px) {
            html {
                font-size: 14px; /* Global scale down for mobile */
            }
        }

        body.light-mode {
            --app-bg: #fcfcfd;
            --app-text: #0a0a0b;
            --app-text-muted: #666666;
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(0, 0, 0, 0.08);
        }

        /* Enforce light mode contrast */
        body.light-mode .text-slate-100, 
        body.light-mode .text-slate-200, 
        body.light-mode .text-white,
        body.light-mode .text-app-text { color: #0a0a0b !important; }
        body.light-mode .text-slate-400,
        body.light-mode .text-slate-500,
        body.light-mode .text-app-muted { color: #666666 !important; }
        body.light-mode .bg-slate-900\/40,
        body.light-mode .bg-white\/5 { background-color: rgba(0, 0, 0, 0.04) !important; }
        body.light-mode .border-white\/5 { border-color: rgba(0, 0, 0, 0.08) !important; }

        * {
            -webkit-font-smoothing: antialiased;
            transition-timing-function: var(--fluid-ease);
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--app-bg);
            color: var(--app-text);
            transition: background-color 0.8s var(--fluid-ease);
            overflow-x: hidden;
            overscroll-behavior-y: none; /* Mobile app feel */
        }

        .ambient-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.12;
            animation: float-prism 25s infinite alternate ease-in-out;
        }

        .orb-1 { width: 60vw; height: 60vw; background: var(--prism-1); top: -20%; left: -20%; }
        .orb-2 { width: 50vw; height: 50vw; background: var(--prism-3); bottom: -10%; right: -10%; animation-delay: -8s; }
        .orb-3 { width: 40vw; height: 40vw; background: var(--prism-2); top: 30%; left: 40%; animation-delay: -15s; }

        @keyframes float-prism {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(5%, 5%) scale(1.1) rotate(5deg); }
            100% { transform: translate(-5%, 8%) scale(1) rotate(-5deg); }
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            transition: all 0.4s var(--fluid-ease);
        }

        .merit-gradient {
            background: var(--prism-gradient);
            background-size: 200% 200%;
            animation: prism-flow 12s ease infinite;
        }

        @keyframes prism-flow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .animate-fluid-in {
            animation: smooth-in 1.2s var(--fluid-ease) forwards;
            opacity: 0;
        }

        @keyframes smooth-in {
            from { opacity: 0; transform: translateY(40px) scale(0.96); filter: blur(10px); }
            to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        .hover-lift {
            transition: transform 0.5s var(--spring-ease), box-shadow 0.5s var(--fluid-ease);
        }
        .hover-lift:hover {
            transform: translateY(-6px) scale(1.015);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .btn-active:active {
            transform: scale(0.94);
            transition: transform 0.1s var(--fluid-ease);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
</head>
<body>
    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>
    <div id="root"></div>
</body>
</html>
